<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div id="teams-container">
                <div class="team-container">
                    <h3>HOME</h3>
                    <div class="scorebox" id="score-team-1"></div>
                    <div class="btn-row">
                        <button onclick="add(1, 1)">+1</button>
                        <button onclick="add(1, 2)">+2</button>
                        <button onclick="add(1, 3)">+3</button>
                    </div>
                </div>
                <div class="team-container">
                    <h3>GUEST</h3>
                    <div class="scorebox" id="score-team-2"></div>
                    <div class="btn-row">
                        <button onclick="add(2, 1)">+1</button>
                        <button onclick="add(2, 2)">+2</button>
                        <button onclick="add(2, 3)">+3</button>
                    </div>
                </div>
            </div>
            <button onclick="reset()">RESET</button>
        </div>
        <script src="index.js"></script>
    </body>
</html>
